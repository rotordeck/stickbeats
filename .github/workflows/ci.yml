name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SF2_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch voice packs (sparse partial clone of the voice repo)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/HansF/edgetx-sdcard-sounds voices-src
          cd voices-src
          git sparse-checkout init --no-cone
          python3 ../voices_build.py --sparse-patterns > .git/info/sparse-checkout
          git checkout
          echo "EDGETX_VOICES_SRC=$GITHUB_WORKSPACE/voices-src" >> "$GITHUB_ENV"
          du -sh SOUNDS | tail -1

      - name: Install FluidSynth and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg

      - name: Cache soundfont
        id: sf2
        uses: actions/cache@v4
        with:
          path: ~/.cache/edgetx-sound-themes/GeneralUser-GS.sf2
          key: sf2-${{ env.SF2_COMMIT }}

      - name: Download GeneralUser GS soundfont
        if: steps.sf2.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/edgetx-sound-themes
          curl -fsSL -o ~/.cache/edgetx-sound-themes/GeneralUser-GS.sf2 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${SF2_COMMIT}/GeneralUser-GS.sf2"

      - uses: astral-sh/setup-uv@v6

      - name: Cache FLAC and MP3 conversions (keyed by content hash, so any old cache is safe to reuse)
        uses: actions/cache@v4
        with:
          path: |
            .flac-cache
            .mp3-cache
          key: media-${{ github.run_id }}
          restore-keys: |
            media-
            flac-

      - name: Build packs and site
        run: uv run build.py --site


  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FluidSynth and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg

      - name: Cache soundfont
        uses: actions/cache@v4
        with:
          path: ~/.cache/edgetx-sound-themes/GeneralUser-GS.sf2
          key: sf2-${{ env.SF2_COMMIT }}

      - name: Download GeneralUser GS soundfont
        run: |
          [ -f ~/.cache/edgetx-sound-themes/GeneralUser-GS.sf2 ] && exit 0
          mkdir -p ~/.cache/edgetx-sound-themes
          curl -fsSL -o ~/.cache/edgetx-sound-themes/GeneralUser-GS.sf2 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/${SF2_COMMIT}/GeneralUser-GS.sf2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test browser mix builder
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser

      - uses: astral-sh/setup-uv@v6

      - name: Test every theme
        run: uv run pytest -q
